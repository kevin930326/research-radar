    var tcol='<div>'+lab('主題')+tl.map(function(q){return li(q.t===6?'<span style="font-size: 14px; color: '+K.T2+'">未分類</span>':'<a href="#" class="totopic" data-t="'+q.t+'" style="font-size: 14px; letter-spacing: 0.02em">'+esc(D.topics[q.t])+'</a>',q.n)}).join('')+'<div style="padding-top: 8px; border-top: 1px solid '+K.HAIR+'; font-size: 13px; line-height: 1.6; color: '+K.T3+'">一篇論文可以有多個主題</div></div>';
    var ps=D.kwp[r.ki].filter(function(p){return S.j.indexOf(p[0])>=0&&(S.gap==null||p[1]!==Y[S.gap])}).slice(0,3);
    var plist='<div>'+lab('最近的論文')+ps.map(function(p){return '<div style="padding: 12px 0; border-top: 1px solid '+K.HAIR+'"><a href="#" class="ttl" style="font-family: '+K.SERIF+'; font-size: '+(M?'17px':'18px')+'; line-height: 1.4; letter-spacing: 0.005em">'+esc(p[2])+'</a><div style="margin-top: 5px">'+mono(esc(p[0])+' · '+p[1]+(p[3]?'':' · 沒有摘要'),12,K.T2)+'</div></div>'}).join('')+
      '<div style="padding-top: 12px; border-top: 1px solid '+K.HAIR+'"><a href="#" style="font-size: 14px; letter-spacing: 0.02em">'+(r.burst&&r.tot!==r.n?'看全部年度 '+r.tot:'看全部 '+r.n)+' 篇</a></div></div>';
    var top=M?'<div>'+lab('逐年篇數')+svg+'</div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px">'+jcol+tcol+'</div>'
      :'<div style="display: grid; grid-template-columns: 420px minmax(0, 1fr) minmax(0, 1fr); column-gap: 56px; align-items: start"><div>'+lab('逐年篇數')+svg+'</div>'+jcol+tcol+'</div>';
    return '<div class="bexp fade" style="padding: 4px 0 30px; display: flex; flex-direction: column; gap: '+(M?'24px':'30px')+'">'+top+plist+'</div>'}
  function burstTab(){var js=sel();if(!js.length)return msg('至少選一本期刊','選回全部 14 本');
    if(S.status==='loading')return '<div role="status" aria-label="載入中">'+[0,1,2,3,4].map(function(i){return '<div style="padding: 22px 0; border-top: 1px solid '+K.HAIR+'">'+K.bar.replace('width: 150px','width: '+(260-i*28)+'px')+'</div>'}).join('')+'</div>';
    var all=burst(js),qi=S.q==null?-1:D.keywords.indexOf(S.q),pick=qi>=0?kwInfo(qi,js):null;
    if(!all.length&&!pick)return msg('沒有爆紅的關鍵字');
    var rest=all.filter(function(r){return !pick||r.k!==pick.k}),shown=rest.slice(0,S.more||20);
    var mx=all.length?all[0].st:1,cols=M?'minmax(0,1fr) 52px 56px 14px':'minmax(0, 1.2fr) minmax(0, 0.6fr) minmax(0, 1.1fr) minmax(0, 1.1fr) 14px',h=function(t,al){return '<div style="text-align: '+(al||'left')+'">'+mono(t,12,K.T3)+'</div>'};
    var head='<div style="display: grid; grid-template-columns: '+cols+'; column-gap: 24px; padding-bottom: 12px">'+h('關鍵字')+h(M?'開始':'開始爆紅')+'<div style="display: flex; align-items: center; gap: 6px">'+mono('強度',12,K.T3)+'<span class="hastip" style="display: inline-flex"><button class="ib" aria-label="強度是什麼">'+K.INFO+'</button><span class="tip fl" role="tooltip" style="width: 260px'+(M?'; left: auto; right: -30px':'')+'">突然變多的程度；數字只能互相比較</span></span></div>'+(M?'':h('相關論文'))+'<span></span></div>';
    var row=function(r){
      var papers='<a href="#" style="font-size: 14px; letter-spacing: 0.02em"><span style="font-family: '+K.MONO+'">'+r.n+'</span> 篇</a>'+(r.na?'<span style="font-size: 13px; color: '+K.T3+'; padding-left: 12px">其中 '+r.na+' 篇沒有摘要</span>':'');
      var st=!r.burst?'<div>'+mono('–',13,K.T3)+'</div>':'<div style="display: flex; align-items: center; gap: 12px">'+mono(r.st.toFixed(1),13,K.T1)+(M?'':'<span aria-hidden="true" style="height: 1px; width: '+Math.max(6,Math.round(180*r.st/mx))+'px; background: '+K.TR+'"></span>')+'</div>';
      var op=S.open===r.k;
      return '<div class="bitem" style="border-top: 1px solid '+K.HAIR+'"><div class="brow" role="button" tabindex="0" aria-expanded="'+op+'" data-k="'+esc(r.k)+'" style="display: grid; grid-template-columns: '+cols+'; column-gap: '+(M?'16px':'24px')+'; align-items: baseline; padding: '+(M?'16px':'18px')+' 0"><div style="min-width: 0"><div style="font-family: '+K.SERIF+'; font-size: '+(M?'19px':'21px')+'; line-height: 1.3; letter-spacing: 0.005em; color: '+K.T1+'">'+esc(r.k)+'</div>'+(M?'<div style="margin-top: 6px">'+papers+'</div>':'')+'</div><div>'+(r.burst?mono(r.y,13,K.TR):'<span style="font-size: 13px; letter-spacing: 0.02em; color: '+K.T2+'; white-space: nowrap">'+(r.past?(r.ps===r.pe?Y[r.ps]:Y[r.ps]+'–'+Y[r.pe])+' 爆紅過':'沒有爆紅')+'</span>')+'</div>'+st+(M?'':'<div>'+papers+'</div>')+'<span style="display: flex; justify-content: flex-end">'+K.CARET+'</span></div>'+(op?burstOpen(r,js):'')+'</div>'};
    var more=rest.length>shown.length?(M?K.moreM:K.more).replace('再載入 20 篇','再載入 '+Math.min(20,rest.length-shown.length)+' 個').replace('已顯示 20／126','已顯示 '+shown.length+'／'+rest.length):'';
    return '<div style="border-bottom: 1px solid '+K.HAIR+'">'+head+(pick?'<div class="bpick" style="border-bottom: 1px solid '+K.BORDER+'; margin-bottom: '+(rest.length?(M?'28px':'40px'):'0')+'">'+row(pick)+'</div>':'')+shown.map(row).join('')+'</div>'+(all.length?'':msg('沒有爆紅的關鍵字').replace('margin-top: 48px','margin-top: 28px'))+more}
  // 搜尋框下面的候選清單
  function sugHtml(){var t=(S.qt||'').trim().toLowerCase();if(!t)return '';
    var hit=[];D.keywords.forEach(function(k,ki){var kl=k.toLowerCase(),p=-1,f=0;while((f=kl.indexOf(t,f))>=0){if(f===0||kl[f-1]===' '||kl[f-1]==='-'){p=f;break}f++}if(p>=0)hit.push({k:k,ki:ki,p:p})});
    hit.sort(function(a,b){return (a.p>0)-(b.p>0)||a.k.length-b.k.length});
    if(!hit.length)return '<div style="padding: 12px 16px 14px"><div style="font-size: 14px; line-height: 1.6; color: '+K.T1+'">沒有這個關鍵字</div><a href="#" class="tofind" style="display: inline-block; margin-top: 6px; font-size: 13px; letter-spacing: 0.02em">到找論文搜尋「'+esc(S.qt.trim())+'」</a></div>';
    return '<div style="padding: 8px 0">'+hit.slice(0,6).map(function(h,i){var a=h.k.slice(0,h.p),b=h.k.slice(h.p,h.p+t.length),c=h.k.slice(h.p+t.length);
      return '<button class="sugi'+(i===0?' first':'')+'" role="option" data-k="'+esc(h.k)+'"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><span style="color: '+K.T2+'">'+esc(a)+'</span><span style="color: '+K.T1+'">'+esc(b)+'</span><span style="color: '+K.T2+'">'+esc(c)+'</span></span>'+mono(kwTotal(h.ki)+' 篇',12,K.T3)+'</button>'}).join('')+'</div>'}
  function syncSug(){var w=root.querySelector('.kwsearch');if(!w)return;var inp=w.querySelector('.kwq'),m=w.querySelector('.kwsug'),t=S.qt||'';
    w.hidden=S.tab!=='burst';if(inp.value!==t)inp.value=t;inp.setAttribute('value',t);w.querySelector('.kwx').hidden=!t;
    var on=!!(S.sug&&t.trim());m.innerHTML=on?sugHtml():'';m.classList.toggle('on',on);inp.setAttribute('aria-expanded',String(on))}
  function pickKw(k){S.q=k;S.qt=k;S.sug=false;S.open=k;render()}

  function noteLines(){var burstOn=!!root.querySelector('.tab[data-tab="burst"]');
    var l1='<div style="font-size: 14px; line-height: 1.7; color: '+K.TR+'">'+Y[P]+' 年只到 '+D.partial+(inc()?'，未滿一年':half()?'，選的期刊今年還沒有論文，不列入成長排名'+(burstOn?'與爆紅關鍵字':''):'，未滿 6 個月，不列入成長排名'+(burstOn?'與爆紅關鍵字':''))+'</div>',t3=function(t){return '<div style="font-size: 13px; line-height: 1.6; color: '+K.T3+'">'+t+'</div>'};
    var fu=0;if(S.future)S.j.forEach(function(k){fu+=S.future.n[k]||0});
    if(fu)l1+='<div class="fut" style="font-size: 14px; line-height: 1.7; color: '+K.TR+'">另有 '+num(fu)+' 篇出版年是 '+(Y[P]+1)+(S.future.more?' 以後':'')+'，還沒列入</div>';
    if(S.tab==='burst')return l1+caution('趨勢反映的是幾年前開始的研究')+t3('關鍵字來自 OpenAlex，快照日期 '+D.snap);
    var u=0;sel().forEach(function(j){j.unc.forEach(function(v){u+=v})});
    return l1+caution('趨勢反映的是幾年前開始的研究')+t3('另有 '+num(u)+' 篇未分類，計入總篇數')+t3('沒有摘要的論文計入篇數，但不參與需要摘要的分析')}

  // ---------- 畫面 ----------
  function syncControls(){
    $$('.tab',root).forEach(function(b){var on=b.dataset.tab===S.tab;b.setAttribute('aria-selected',String(on));b.classList.toggle('on',on)});
    $$('.seg[data-g]',root).forEach(function(b){var on=S[b.dataset.g]===b.dataset.v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))});
    var burstT=S.tab==='burst';
    root.querySelector('.g-mode').hidden=burstT;root.querySelector('.g-weight').hidden=burstT||S.mode==='count';
    $$('.sep',root).forEach(function(e,i){e.hidden=burstT||(i===1&&S.mode==='count')});
    root.querySelector('.cross-pick').hidden=S.tab!=='cross';syncSug();
    var jc=root.querySelector('.fw[data-m="journal"]'),n=S.j.length,isAis=n===11&&AIS.every(function(k){return S.j.indexOf(k)>=0});
    jc.querySelector('.vl').innerHTML=n===ALLJ.length?'':'<i>·</i>'+(isAis?'AIS 核心 11 本':n+' 本');
    jc.querySelector('.chip').classList.toggle('sel',n!==ALLJ.length);
    $$('input[type=checkbox]',jc).forEach(function(c){c.checked=S.j.indexOf(c.dataset.v)>=0;c.toggleAttribute('checked',c.checked)});
    $$('.qk',jc).forEach(function(b){var on=b.dataset.q==='all'?n===ALLJ.length:isAis;b.classList.toggle('qon',on)});
    ['a','b'].forEach(function(k){var w=root.querySelector('.fw[data-m="t'+k+'"]');w.querySelector('.lb').textContent=D.topics[S[k]];
      $$('input',w).forEach(function(r,i){r.checked=i===S[k];r.toggleAttribute('checked',i===S[k]);r.closest('.opt').hidden=i===S[k==='a'?'b':'a']})});
    $$('.fw',root).forEach(function(w){var on=S.menu===w.dataset.m,m=w.querySelector('.menu');w.querySelector('.chip').setAttribute('aria-expanded',String(on));if(m)m.classList.toggle('on',on)})}
  function render(){syncControls();
    if(S.status==='error'){body.innerHTML=msg('沒有載入成功','重新整理',true);notes.innerHTML='';done();return}
    body.innerHTML=S.tab==='topic'?topicTab():S.tab==='cross'?crossTab():burstTab();
    notes.innerHTML=sel().length?noteLines():'';notes.hidden=!sel().length;
    if(!fitting&&fit()){fitting=true;render();fitting=false;return}
    done()}
  // 實際預覽：圖照容器的實際寬度畫，視窗窄的時候字不會跟著縮小
  var CW=936,SW=285,fitting=false;
  function fit(){if(root.dataset.static||M)return false;var ch=false,pw,e=body.querySelector('svg.ch.big');
    if(e){pw=Math.round(e.parentNode.clientWidth);if(pw>300&&Math.abs(pw-CW)>2){CW=pw;ch=true}}
    e=body.querySelector('.sm');if(e){pw=Math.round(e.clientWidth);if(pw>150&&Math.abs(pw-SW)>2){SW=pw;ch=true}}
    return ch}
  if(!root.dataset.static)addEventListener('resize',function(){render()});
  function done(){document.body.setAttribute('data-h',root.getBoundingClientRect().height)}
  function setHover(i){if(S.hover===i)return;S.hover=i;var svg=body.querySelector('svg.ch');if(!svg||!svg.querySelector('.hl'))return;
    var hl=svg.querySelector('.hl');if(i==null){hl.setAttribute('visibility','hidden')}else{hl.setAttribute('visibility','visible');hl.setAttribute('transform','translate('+xOf(svg,i)+',0)')}
    $$('.yl',svg).forEach(function(t){t.setAttribute('fill',+t.dataset.i===i?K.GOLD:K.T3)});
    var key=S.tab==='cross'?{p:pairIdx(S.a,S.b)}:{t:S.focus},ro=body.querySelector('.ro');if(ro){var d=document.createElement('div');d.innerHTML=readout(series(key),i);ro.parentNode.replaceChild(d.firstChild,ro)}}

  function closeTips(){S.tip=false;$$('.tip.fl.on',root).forEach(function(x){x.classList.remove('on')});$$('.ib[aria-expanded="true"]',root).forEach(function(x){x.setAttribute('aria-expanded','false')})}
  root.addEventListener('keydown',function(e){if(e.key==='Escape')closeTips()});
  root.addEventListener('click',function(e){var t=e.target,b;
    if(b=t.closest('.chip.f')){var m=b.closest('.fw').dataset.m;S.menu=S.menu===m?'':m;syncControls();return}
    if(!t.closest('.menu')&&S.menu){S.menu='';syncControls()}
    if(b=t.closest('.ib')){var tp=b.parentNode.querySelector('.tip.fl'),on=tp&&!tp.classList.contains('on');closeTips();if(on){tp.classList.add('on');b.setAttribute('aria-expanded','true')}return}
    if(!t.closest('.tip'))closeTips();
    if(b=t.closest('.sugi')){pickKw(b.dataset.k);return}
    if(t.closest('.kwx')){S.q=null;S.qt='';S.sug=false;render();if(!root.dataset.static)root.querySelector('.kwq').focus();return}
    if(!t.closest('.kwsearch')&&S.sug){S.sug=false;syncSug()}
    if(t.closest('.morebtn')){S.more=(S.more||20)+20;render();return}
    if(b=t.closest('.tab')){S.tab=b.dataset.tab;S.hover=null;S.table=false;S.exp=false;render();return}
    if(b=t.closest('.seg[data-g]')){S[b.dataset.g]=b.dataset.v;render();return}
    if(b=t.closest('.qk')){S.j=b.dataset.q==='all'?ALLJ.slice():AIS.slice();render();return}
    if(b=t.closest('.sm, .gr')){S.focus=+b.dataset.t;S.hover=null;render();if(!root.dataset.static){var f=body.querySelector('.back6');if(f&&b.classList.contains('sm'))f.focus()}return}
    if(t.closest('.back6')){e.preventDefault();S.focus=null;S.hover=null;S.table=false;S.exp=false;render();return}
    if(t.closest('.tblbtn')){S.table=!S.table;S.hover=null;render();body.querySelector('.tblbtn').focus();return}
    if(t.closest('.expbtn')){S.exp=!S.exp;render();body.querySelector('.expbtn').focus();return}
    if(b=t.closest('.totopic')){e.preventDefault();S.tab='topic';S.focus=+b.dataset.t;S.hover=null;S.table=false;S.exp=false;render();if(!root.dataset.static)root.querySelector('.tab[data-tab="topic"]').focus();return}
    if((b=t.closest('.brow'))&&!t.closest('a, button')){var k=b.dataset.k;S.open=S.open===k?null:k;render();var nb=$$('.brow',body).filter(function(x){return x.dataset.k===k})[0];if(nb&&!root.dataset.static)nb.focus();return}
    if(b=t.closest('.act')){if(S.status==='error'){S.status=''}else{S.j=ALLJ.slice()}render();return}
    if(t.closest('a[href="#"]'))e.preventDefault()});
  root.addEventListener('change',function(e){var c=e.target,w=c.closest('.fw');if(!w)return;
    if(w.dataset.m==='journal'){S.j=$$('input[type=checkbox]',w).filter(function(x){return x.checked}).map(function(x){return x.dataset.v});render();return}
    var k=w.dataset.m==='ta'?'a':'b';S[k]=$$('input',w).indexOf(c);S.menu='';S.hover=null;render()});
  root.addEventListener('input',function(e){if(e.target.classList.contains('kwq')){S.qt=e.target.value;S.sug=true;syncSug()}});
  root.addEventListener('focusin',function(e){if(e.target.classList&&e.target.classList.contains('kwq')&&S.qt&&!S.sug&&S.qt!==S.q){S.sug=true;syncSug()}});
  root.addEventListener('keydown',function(e){
    if(e.target.classList&&e.target.classList.contains('kwq')){var items=$$('.sugi',root);
      if(e.key==='Enter'){e.preventDefault();if(items.length)pickKw(items[0].dataset.k);return}
      if(e.key==='ArrowDown'&&items.length){e.preventDefault();items[0].focus();return}
      if(e.key==='Escape'&&S.sug){S.sug=false;syncSug();return}}
    if(e.target.classList&&e.target.classList.contains('sugi')){var its=$$('.sugi',root),ix=its.indexOf(e.target);
      if(e.key==='ArrowDown'){e.preventDefault();(its[ix+1]||its[0]).focus();return}
      if(e.key==='ArrowUp'){e.preventDefault();(ix>0?its[ix-1]:root.querySelector('.kwq')).focus();return}
      if(e.key==='Escape'){S.sug=false;syncSug();root.querySelector('.kwq').focus();return}}if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('brow')){e.preventDefault();e.target.click();return}if(e.key==='Escape'&&S.menu){var w=root.querySelector('.fw[data-m="'+S.menu+'"] .chip');S.menu='';syncControls();if(w)w.focus()}});
  body.addEventListener('mousemove',function(e){var svg=e.target.closest&&e.target.closest('svg.ch');if(!svg||!svg.querySelector('.pt'))return;
    var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,px=(e.clientX-r.left)*vb.width/r.width,l=+svg.dataset.l,iw=+svg.dataset.iw;
    var i=svg.dataset.bars==='1'?Math.floor((px-l)/(iw/N)):Math.round((px-l)/iw*(N-1));setHover(Math.max(0,Math.min(N-1,i)))});
  body.addEventListener('mouseleave',function(){setHover(null)});
  body.addEventListener('focusin',function(e){var a=e.target.closest&&e.target.closest('a.pt');if(a)setHover(+a.dataset.i)});
  root._set=function(o){for(var k in o)S[k]=o[k];render()};
  render();
});
})();
</script>
