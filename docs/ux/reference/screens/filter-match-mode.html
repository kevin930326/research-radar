function swapLib(el,toAdded){var row=el.closest('.prow'),mb=!!el.closest('.v-mobile'),ttl=row.querySelector('a.ttl').textContent,n;
 if(toAdded){n=document.createElement('span');n.className='added in';n.style.cssText='height:34px;min-width:'+(mb?'0':'146px')+';box-sizing:border-box;padding:'+(mb?'0 4px 0 0':'0 0 0 15px')+';display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.04em;color:#A8A294;white-space:nowrap';
  var d=document.createElement('span');d.style.cssText='width:6px;height:6px;border-radius:50%;background:#EFEAE0';n.appendChild(d);n.appendChild(document.createTextNode('已加入'));
  var b=document.createElement('button');b.className='txt rm hit';b.style.marginLeft=mb?'12px':'10px';b.textContent='移出';b.setAttribute('aria-label','移出我的文獻庫：'+ttl);n.appendChild(b);el.parentNode.replaceChild(n,el);b.focus({preventScroll:true})}
 else{n=document.createElement('button');n.className='add hit back';n.setAttribute('aria-label','加入我的文獻庫：'+ttl);n.innerHTML='<svg aria-hidden="true" fill="none" height="11" viewBox="0 0 11 11" width="11"><path d="M5.5 0.5v10M0.5 5.5h10" stroke="currentColor" stroke-width="1"></path></svg>加入我的文獻庫';el.parentNode.replaceChild(n,el);n.focus({preventScroll:true})}}
function clearAll(){S.j=[];S.y='';S.t=[];S.m=[];S.abs=S.full=false;S.q='';$$('input.q').forEach(function(q){q.value=''});update(true)}
document.addEventListener('click',function(e){var t=e.target,x;
 if(x=t.closest('.pvbar a')){e.preventDefault();var g=x.dataset.g;S[g]=x.dataset.v;if(g==='site'){build();preset()}else if(g==='st')preset();else update();return}
 if(x=t.closest('a[href="#"]'))e.preventDefault();
 if(x=t.closest('[data-chip]')){var m=x.parentNode.querySelector('.menu.fl'),on=!m.classList.contains('on');closeMenus(m);m.classList.toggle('on',on);x.setAttribute('aria-expanded',String(on));return}
 if(!t.closest('.fw'))closeMenus();
 if(x=t.closest('.mm .seg')){S[x.parentNode.dataset.k+'m']=x.dataset.mode;update(true);return}
 if(x=t.closest('.clr')){var k=x.dataset.k;S[k]=[];update(true);return}
 if(t.closest('.zany')){S.tm=S.mm='any';update(true);return}
 if(t.closest('.clrall')||t.closest('.clrall2')){clearAll();return}
 if(x=t.closest('button[data-tg]')){S[x.dataset.tg]=!S[x.dataset.tg];update(true);return}
 if(x=t.closest('.seg.scope')){$$('.seg.scope',x.parentNode).forEach(function(b){b.classList.toggle('on',b===x);b.setAttribute('aria-pressed',String(b===x))});return}
 if(x=t.closest('button.add')){swapLib(x,true);return}
 if(x=t.closest('.prow button.rm')){swapLib(x.closest('.added'),false);return}
 if(t.closest('.mfbtn')){openSheet();return}
 if(t.closest('.mclose')||t.closest('.mgo')){closeSheet();return}
 if(x=t.closest('.acch')){var a=x.parentNode,o=!a.classList.contains('open');$$('.acc').forEach(function(c){c.classList.remove('open');c.querySelector('.acch').setAttribute('aria-expanded','false')});a.classList.toggle('open',o);x.setAttribute('aria-expanded',String(o));update()}
});
document.addEventListener('change',function(e){var t=e.target,k=t.dataset.k;
 if(t.dataset.tg){S[t.dataset.tg]=t.checked;update(true);return}
 if(!k)return;
 if(k==='y')S.y=t.dataset.v;else{var i=S[k].indexOf(t.dataset.v);if(t.checked&&i<0)S[k].push(t.dataset.v);if(!t.checked&&i>=0)S[k].splice(i,1);
  var order=k==='j'?JK:(k==='t'?T19:MS).concat(['未分類']);S[k].sort(function(a,b){return order.indexOf(a)-order.indexOf(b)})}
 update(true)});
document.addEventListener('input',function(e){if(e.target.classList.contains('q')){S.q=e.target.value.trim();$$('input.q').forEach(function(q){if(q!==e.target)q.value=e.target.value});update()}});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;var o=$('.menu.fl.on');if(o){var c=o.parentNode.querySelector('.chip.f');closeMenus();c.focus()}else if(!msw.hidden)closeSheet()});
var h=location.hash.slice(1).split('.');if(h[0]==='demo'||h[0]==='member')S.site=h[0];if(['one','two','all','zero'].indexOf(h[1])>=0)S.st=h[1];if(WORD[h[2]])S.w=h[2];
build();preset();
})();
