# 中文重點的驗證門檻（PRD FR-14、NFR-4、ADR-0032）：domain 驗證（radar/domain/validators/zh_summary.py）
# 讀這份。三個鍵都要寫，只收整數；改了不必升 prompt 版本，也不算進輸入指紋。

# 每欄正規化後（NFC、連續空白縮成一個、去頭尾）最多幾個字元；任一欄超過就整筆拒收。
# PRD FR-14 的預設是 150 字。prompt（prompts/zh_summary/v3.md）仍然要模型寫 80 字以內；這裡只擋失控的長度：
# 2026-11-16 全庫 7,708 篇裡，上限 100 時有 835 篇被拒收，其中 805 篇最長的一欄不超過 150 字
# （ADR-0032 的「每欄上限 100 → 150」更新）。
max_chars_per_field: 150

# 摘要至少幾句（以 . ! ? 加空白切）才檢查逐句翻譯：輸出句數不少於摘要句數就拒收。
# 句數少的摘要，逐句翻譯和合格的四欄重點分不出來，所以不檢查（ADR-0032）。最少 2。
# 原本 5；2026-11-18 改 7：2026-11-17 查全庫，被這條擋的 12 篇，摘要都只有 5～6 句，輸出都是分欄的
# 重點，不是逐句翻譯（ADR-0032 的「把輸入讀得更完整」更新）。
translation_min_abstract_sentences: 7

# 每欄漢字至少佔（漢字數＋英文詞數）的百分之幾，低於就當作不是繁中（1～100）。
min_cjk_percent: 50
