# 追蹤的期刊（AD-18 領域設定；api、worker、CLI 啟動時由 radar/config.py 驗證，錯了就不啟動）。
#
# - start_year：從哪一年起抓（含當年度）；查 OpenAlex 時篩 publication_year > start_year - 1。
# - key：期刊代號，小寫英文開頭、只用小寫英文、數字、底線，不可重複。
# - name：期刊全名。
# - issn_l：OpenAlex 的 ISSN-L（查詢用 primary_location.source.issn），不可重複。
#
# 來源：spikes/oq-02/output/results.json（2026-11-11）各筆的 source.issn_l 與 expected；
# 2016–2025 合計 9,643 篇，是 OQ-02 的基準。新增期刊只要在這裡加一筆。
start_year: 2016
