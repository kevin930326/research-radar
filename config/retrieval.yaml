# 檢索的設定值（Story 4.1、ADR-0005）：搜尋、找相似論文、問答都經 services/retrieval.py 的
# retrieve()，讀這一份（radar/config.py 的 load_retrieval_config 驗證）。
# 查詢向量的模型、維度、每日額度不在這裡：用 embeddings.yaml（和背景向量化同一個模型、同一本帳）。

# 向量腿的相似度下限（餘弦相似度，0 到 1，字串避免浮點數失真）：比這個不像的不算結果。
# 沒有下限的話向量搜尋永遠找得到「最近的」幾篇，「找不到相關的論文」「沒有夠相似的論文」不會出現。
# 初始值刻意放低（寧可尾巴多幾篇不相關的，也不要把相關的擋掉）；4.4 用評估題組量過再調。
vector_min_similarity: "0.2"

# 向量腿、全文檢索腿各取前幾名再融合（ADR-0005 第 5 點）。也是結果篇數的上限：
# 兩條腿都取滿時，融合後最多 2 × 這個數字篇。
leg_limit: 100

# RRF 的 k：每篇在每條腿的分數是 1 ÷ (k ＋ 名次)，兩條腿相加（ADR-0005 第 5 點）。
rrf_k: 60

# 搜尋每頁幾篇（ADR-0005 第 8 點）。
page_size: 20

# 問答取前幾篇（ADR-0005 第 8 點；Epic 5 用）。
qa_paper_count: 12

# 查詢字串最多幾個字（去掉頭尾空白之後算）：超過就不收，不截斷。
query_max_length: 500
