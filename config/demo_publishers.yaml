# 示範站不放完整內容的出版社與期刊（AD-18 領域設定；api、worker、CLI 啟動時由 radar/config.py 驗證，
# 錯了就不啟動）。ADR-0007 第 5 點、ADR-0052。
#
# 這些出版社的論文就算是 CC BY，也不算「示範站可用」（paper.demo_eligible 是 false），
# 不會進 view demo_full_paper：示範站上只有書目與分類標籤。
#
# - id：OpenAlex 的出版社 ID（P 開頭，例如 P4310320990；也可以寫 https://openalex.org/P…）。
#   還沒查證就寫 null。
# - name：OpenAlex host_organization_name 的完整寫法。比對時兩邊都只比字母與數字（同
#   normalize_publisher_name，ADR-0052 第 5 點）：大小寫、空白、標點、看不見的字元都不影響，
#   例如 IEEE Computer Society、IEEE-Computer Society、IEEEComputerSociety 算同一個名稱，
#   I.E.E.E. 等於 IEEE。名稱至少要有一個字母或數字。
# - note：為什麼列、出處（只給人看）。
# - 比對：論文「出版社自己那一版」（primary_location.source）的出版社 ID 與名稱，含上層出版社
#   （host_organization_lineage、host_organization_lineage_names）；任一個 ID 或名稱對上就排除。
#   同一家可以寫好幾筆（不同寫法的名稱各一筆）。排除方向多對上只會更保守。
# - excluded 至少一筆。
#
# excluded_journals：依期刊排除（ADR-0052「更新（2026-11-22）」）。論文的期刊 ISSN-L
# （paper.journal_issn_l）對上就排除，和上面出版社那一道是「任一個對上就排除」：出版社名稱是清單外的
# 寫法（例如前面多一個 The）、又沒有對上的 ID 時，靠這一道擋住。
# - issn_l：期刊的 ISSN-L。有無連字號、小寫 x 都收（同 normalize_issn_l，例如 "00189391" 等於
#   0018-9391）；沒有連字號時要加引號，不然 YAML 會讀成數字、算寫錯。看不懂的格式算寫錯（啟動
#   檢查列出、不啟動）。
# - name：期刊名稱（只給人看，不參與比對）。
# - note：為什麼列、出處（只給人看）。
# - 這個清單可以是空的或整個不寫（等於不依期刊排除）。論文沒有期刊 ISSN-L 時這一道不算對上。
#
# 清單改了之後，已經存下的 demo_eligible 不會自己變：要跑 `radar reparse` 重算（ADR-0052）。
#
# IEEE 的出版社 ID P4310319808 已查證：Kevin 2026-11-20 用唯讀查詢從資料庫查到（IEEE Transactions on
# Engineering Management，ISSN-L 0018-9391，2,893 篇，出版社 ID 只有這一個、名稱只有全名一種寫法），
# 寫在全名那一筆。IEEE、IEEE Computer Society 兩筆留著當保守的寫法（id 為 null、名稱沒有實際資料
# 對照）。名稱仍是判定的必要條件：只有 ID、沒有名稱的論文一律不算可用（ADR-0052 第 4 點）。
excluded:
  - id: P4310319808
    name: Institute of Electrical and Electronics Engineers
    note: Kevin 2026-11-14 決定；Kevin 回 IEEE 的信承諾示範站不顯示 IEEE 的全文與摘要。ID 與名稱已查證：Kevin 2026-11-20 用唯讀查詢從資料庫的 IEEE TEM 論文（2,893 篇）查到，ID 只有這一個、名稱只有這一種寫法。
  - id: null
    name: IEEE
    note: 同上，縮寫寫法。名稱未經 OpenAlex 資料查證。
  - id: null
    name: IEEE Computer Society
    note: 同上，IEEE 底下的學會出版品。名稱未經 OpenAlex 資料查證。
excluded_journals:
  - issn_l: 0018-9391
    name: IEEE Transactions on Engineering Management
    note: Kevin 2026-11-20 用唯讀查詢從資料庫查到的 ISSN-L（同 ADR-0052「更新（2026-11-21）」那一次查詢）；IEEE 的期刊，出版社名稱寫法對不上時靠這一筆排除。
