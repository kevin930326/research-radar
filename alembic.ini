# Alembic 的設定（只給開發與 CI 用 alembic 指令，例如 `alembic check`、`alembic revision`）。
# 連線字串不寫在這裡：migrations/env.py 經 radar.config 讀 RADAR_MIGRATION_DATABASE_URL（擁有者角色）。
# 平常的遷移用 `radar migrate`，它不讀這個檔。
[alembic]
script_location = %(here)s/migrations
# 遷移檔名：<四位數流水號>_<說明>.py；版本號用 `alembic revision --rev-id 0002 -m "..."` 指定。
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
