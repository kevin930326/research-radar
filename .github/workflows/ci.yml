# CI（ADR-0017）：固定檢查 → 兩種架構各自建映像並冒煙 → 合併成多架構標籤推到 GHCR。
# 前端檢查是另一個和 checks 平行的 web job（ADR-0036）；映像的建置本身也會建前端。
# - 不用任何 repo secret；推 GHCR 用內建的 github.token。
# - 第三方 action 一律釘 40 碼 commit SHA，註解寫版本。
# - 只有 push 事件推映像：pull_request 的 github.sha 是 GitHub 暫時產生的合併 commit。
# - push 只看 main；分支上的 commit 由 pull_request 檢查一次（ADR-0017 補充，Kevin 2026-11-15：
#   原本每個 commit 跑兩遍，兩天用掉每月 3,000 分鐘的九成）。所以只有 main 的 commit 會推映像。
# - 同一個 PR 有新的 commit 時，取消還在跑的舊執行。main 的每次執行各自一組（用 run_id），
#   彼此不排隊、不取消：每個合併都要有結果與映像。
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kevin930326/research-radar

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    # 20 分鐘在 2026-11-18 起不夠用（main 上已要 16～18 分鐘，整合測試還在增加）。
    timeout-minutes: 30
    steps:
      - name: 取出程式碼（含完整歷史，給 gitleaks 掃）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安裝 uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.14"

      - name: 安裝相依套件
        run: uv sync --locked

      - id: ruff
        name: ruff（風格）
        run: uv run --no-sync ruff check .

      - id: ruff-format
        name: ruff（排版）
        run: uv run --no-sync ruff format --check .

      - id: mypy
        name: mypy
        run: uv run --no-sync mypy

      - id: import-linter
        name: import-linter
        run: uv run --no-sync lint-imports

      - id: pytest-unit
        name: pytest（unit）
        run: uv run --no-sync pytest -m unit

      # openapi.json 進版控（AD-21、NFR-12、ADR-0047）：用程式重新輸出，和版控裡的不一樣就失敗。
      - id: openapi-drift
        name: openapi.json 和程式一致
        run: |
          set -euo pipefail
          uv run --no-sync radar export-schema
          git diff --exit-code -- openapi.json

      # integration、arch 的測試資料庫與 alembic-check 都連這個 db（compose 的初始化腳本建好兩個角色
      # 與擴充套件）。專案名稱另取，不和本機的 research-radar 混在一起。
      - name: 起 compose 的 db（測試資料庫與 alembic check 用）
        run: docker compose --env-file /dev/null --project-name radar-ci --file compose.yaml up --detach --wait db

      # 備份與還原的整合測試（Story 3.18、ADR-0051）要真的 pg_dump／pg_restore／psql 18 與 age：
      # 執行機內建的 PostgreSQL 用戶端比資料庫（18）舊，也沒有 age。PGDG 的金鑰先驗指紋才用；
      # 不執行任何下載來的腳本。18 版的執行檔目錄放進 PATH 最前面（不經 Debian 的版本選擇包裝）。
      - name: 裝 PostgreSQL 18 的用戶端與 age（備份與還原的整合測試用）
        env:
          PGDG_SIGNER_FPR: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/pgdg.asc"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 \
            --output "${key}" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons "${key}" > "${RUNNER_TEMP}/pgdg-keys.txt"
          test "$(grep -c '^pub:' "${RUNNER_TEMP}/pgdg-keys.txt")" = 1
          test "$(awk -F: '$1 == "fpr" { print $10; exit }' "${RUNNER_TEMP}/pgdg-keys.txt")" \
            = "${PGDG_SIGNER_FPR}"
          sudo install -D --mode 0644 "${key}" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-18 age
          echo "/usr/lib/postgresql/18/bin" >> "${GITHUB_PATH}"

      - id: pytest-integration
        name: pytest（integration）
        # 找不到 pg_dump、age 時備份與還原的整合測試直接失敗（本機才是跳過）。
        env:
          RADAR_REQUIRE_BACKUP_TOOLS: "1"
        run: uv run --no-sync pytest -m integration

      - id: pytest-arch
        name: pytest（arch）
        run: uv run --no-sync pytest -m arch

      # 先遷移 compose 的 radar 資料庫（擁有者角色），再比對模型與遷移是否一致（AD-18）。
      - id: alembic-check
        name: alembic check（模型與遷移一致）
        env:
          RADAR_MIGRATION_DATABASE_URL: postgresql://radar_owner@127.0.0.1:5432/radar
        run: |
          set -euo pipefail
          uv run --no-sync radar migrate
          uv run --no-sync alembic check

      # gitleaks 與 pip-audit 在前面的檢查失敗時仍要跑：秘密外洩或有漏洞的套件不能因此沒被回報。
      - id: gitleaks
        name: gitleaks（整段 git 歷史）
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner .

      - id: pip-audit
        name: pip-audit（uv.lock 的全部套件，含 dev）
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          uv export --locked --all-groups --no-emit-project --format requirements-txt \
            > "${RUNNER_TEMP}/requirements.txt"
          uv run --no-sync pip-audit --disable-pip --strict --progress-spinner off \
            --requirement "${RUNNER_TEMP}/requirements.txt"

  # 前端（Story 3.1、ADR-0036）：和 checks 平行；步驟和本機 web/ 的 npm scripts 同一組。
  # Playwright 在 CI 跑 chromium、firefox、webkit 三種引擎（CI=true 時 playwright.config.ts 會打開）。
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: 取出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安裝 Node.js（版本照 web/.nvmrc）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - id: web-npm-ci
        name: npm ci（照 package-lock.json）
        run: npm ci --no-audit --no-fund

      # 前端型別由 orval 從 openapi.json 產生（ADR-0047）：重新產生後 src/generated/ 有任何差異
      # （有人手改、或 openapi.json 改了沒重新產生、多出新檔）就失敗。
      - id: web-generated-drift
        name: orval 產生的檔和 openapi.json 一致
        run: |
          set -euo pipefail
          npm run generate:api
          git diff --exit-code -- src/generated
          changed=$(git status --porcelain --untracked-files=all -- src/generated)
          if [ -n "${changed}" ]; then echo "${changed}" >&2; exit 1; fi

      - id: web-lint
        name: ESLint
        run: npm run lint

      - id: web-typecheck
        name: 型別檢查
        run: npm run typecheck

      - id: web-test
        name: Vitest
        run: npm test

      - id: web-build-member
        name: 建置（成員版）
        run: npm run build:member

      - id: web-build-demo
        name: 建置（示範站）
        run: npm run build:demo

      # --with-deps 會用 apt 裝瀏覽器要的系統套件（約 125 MB）。執行機的 apt 從鏡像站清單
      # （/etc/apt/apt-mirrors.txt，sources 用 mirror+file:）挑站，第一優先是
      # us-east-2.ec2.archive.ubuntu.com；2026-11-18 起從那裡下載只有 113 KB/s，這一步裝了 18 分鐘，
      # 撞 20 分鐘時限。apt 只在「連不上」時才換下一個站，「很慢」不會換，所以把 Ubuntu 官方主站
      # 改成 priority:1，原本清單裡的站照原來的順序排在後面當備用（沒寫 priority 的站，apt 會隨機排）。
      # 只換 Ubuntu 官方的站，套件仍由 apt 用 Ubuntu 的金鑰驗簽；逾時與重試沿用執行機本來的設定。
      - id: web-playwright-install
        name: 安裝 Playwright 的三種瀏覽器
        run: |
          set -euo pipefail
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "${mirrors}" ]; then
            # 主站已在清單裡的話不重複（http 與 https 都算）。
            awk 'BEGIN { print "http://archive.ubuntu.com/ubuntu/\tpriority:1"; n = 1 }
                 $1 != "" && $1 !~ /^#/ && $1 !~ /^https?:\/\/archive\.ubuntu\.com\// { n++; print $1 "\tpriority:" n }' \
              "${mirrors}" > "${RUNNER_TEMP}/apt-mirrors.txt"
            sudo install --mode 0644 "${RUNNER_TEMP}/apt-mirrors.txt" "${mirrors}"
            cat "${mirrors}"
          else
            echo "::warning::找不到 ${mirrors}，鏡像站順序沒有改，照執行機預設的來源安裝"
          fi
          npx playwright install --with-deps chromium firefox webkit

      - id: web-e2e
        name: Playwright＋axe（三種引擎，帶 CSP 的建置結果）
        run: npm run e2e

  image:
    name: image (${{ matrix.arch }})
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      # 一個架構失敗時，另一個仍跑完，才知道是不是兩邊都壞。
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: 取出程式碼
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 建映像（原生執行機，不用模擬器）
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag radar-ci-src .

      - name: 冒煙測試（db＋api，/healthz、/readyz、radar migrate）
        env:
          ARCH: ${{ matrix.arch }}
        run: .github/scripts/smoke.sh radar-ci-src "${ARCH}"

      - name: 登入 GHCR
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: 推映像（冒煙通過的同一個映像）
        if: github.event_name == 'push'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker tag radar-ci-src "${IMAGE}:${GITHUB_SHA}-${ARCH}"
          docker push "${IMAGE}:${GITHUB_SHA}-${ARCH}"

  manifest:
    name: manifest
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: 登入 GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "${REGISTRY_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: 合併成多架構標籤
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" "${IMAGE}:${GITHUB_SHA}-arm64"

      - name: 確認兩個平台都在
        run: |
          set -euo pipefail
          platforms=$(docker buildx imagetools inspect --raw "${IMAGE}:${GITHUB_SHA}" \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"')
          echo "${platforms}"
          for platform in linux/amd64 linux/arm64; do
            grep -qx "${platform}" <<< "${platforms}" || { echo "缺少 ${platform}" >&2; exit 1; }
          done
