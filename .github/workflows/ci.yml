# 【探測分支 ci/firefox-crash-probe 專用，不合併】只跑 firefox 的 a11y.spec.ts，找論文頁當掉的原因。
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: V0-base, mode: element, prefs: "{}", trace: "", repeat: "15" }
          - { name: V1-trace-off, mode: element, prefs: "{}", trace: "off", repeat: "15" }
          - { name: V2-reflect-only, mode: reflect, prefs: "{}", trace: "", repeat: "15" }
          - { name: V3-full-reflection-off, mode: full, prefs: "{\"accessibility.ARIAElementReflection.enabled\":false}", trace: "", repeat: "5" }
          - { name: V4-full-trace-off, mode: full, prefs: "{}", trace: "off", repeat: "5" }
    defaults:
      run:
        working-directory: web
    env:
      PROBE_MODE: ${{ matrix.mode }}
      PROBE_PREFS: ${{ matrix.prefs }}
      PROBE_TRACE: ${{ matrix.trace }}
      PROBE_ONLY: aria-allowed-attr,aria-prohibited-attr,aria-conditional-attr,nested-interactive,label-content-name-mismatch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: 安裝 firefox（鏡像站順序同 ci.yml）
        run: |
          set -euo pipefail
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "${mirrors}" ]; then
            awk 'BEGIN { print "http://archive.ubuntu.com/ubuntu/\tpriority:1"; n = 1 }
                 $1 != "" && $1 !~ /^#/ && $1 !~ /^https?:\/\/archive\.ubuntu\.com\// { n++; print $1 "\tpriority:" n }' \
              "${mirrors}" > "${RUNNER_TEMP}/apt-mirrors.txt"
            sudo install --mode 0644 "${RUNNER_TEMP}/apt-mirrors.txt" "${mirrors}"
          fi
          npx playwright install --with-deps firefox

      - name: 環境
        run: |
          nproc; free -m; df -h /dev/shm; ulimit -a
          npx playwright --version
          ls ~/.cache/ms-playwright
          cat ~/.cache/ms-playwright/firefox-*/firefox/application.ini 2>/dev/null | grep -E '^(Version|BuildID)=' || true

      - name: 跑 a11y（firefox，重複 20 次，不重試）
        env:
          DEBUG: pw:browser*
          GREP: ""
          INVERT: ""
          WORKERS: "2"
          REPEAT: ${{ matrix.repeat }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p probe
          ( while true; do echo "== $(date +%T)"; free -m | sed -n 2p; ps -eo rss,comm --sort=-rss | head -6 | tail -5; sleep 2; done ) > probe/mem.log 2>&1 &
          sampler=$!
          args=(--project=firefox --retries=0 --repeat-each="${REPEAT}" --workers="${WORKERS}" --reporter=list e2e/a11y.spec.ts)
          if [ -n "${GREP}" ]; then args+=(--grep "${GREP}"); fi
          if [ -n "${INVERT}" ]; then args+=(--grep-invert "${INVERT}"); fi
          npx playwright test "${args[@]}" > probe/list.log 2> probe/pw-debug.log
          code=$?
          kill "${sampler}" || true
          echo "exit=${code}"
          tail -8 probe/list.log
          echo "--- 每頁當掉次數"
          grep -E '✘' probe/list.log | sed -E 's/.*› //; s/: no axe.*//' | sort | uniq -c || true
          echo "--- 當掉時的元素"
          grep -ohE 'STEP-CRASH [^ ]+' probe/list.log | sort | uniq -c || true
          echo "--- 反射屬性在不在"
          grep -ohE 'REFLECTION (true|false)' probe/list.log | sort | uniq -c || true
          grep -ohE 'LAST .*' probe/list.log | sort | uniq -c | sort -rn | head -30 || true
          grep -ohE 'CRASH-AT .*' probe/list.log | sed -E 's/#([0-9]+)\/[0-9]+//' | sort | uniq -c | sort -rn | head -40 || true
          echo "--- 錯誤種類"
          grep -oE 'Error: .{0,80}' probe/list.log | sort | uniq -c | sort -rn | head -10 || true
          echo "--- firefox stderr 可疑行"
          grep -aiE 'crash|MOZ_|signal|SIGSEGV|SIGKILL|SIGABRT|out of memory|OOM|abort|assert|channel error|ipc|Exiting due' probe/pw-debug.log | sed -E 's/^.{0,40}pw:browser/pw:browser/' | sort | uniq -c | sort -rn | head -60 || true
          echo "--- 記憶體最低點"
          grep -E '^Mem:' probe/mem.log | awk '{print $7}' | sort -n | head -3

      - name: 核心紀錄（OOM 等）
        if: always()
        run: |
          free -m; df -h /dev/shm
          sudo dmesg -T 2>/dev/null | grep -iE 'oom|killed process|segfault|traps|general protection|out of memory' | tail -40 || true
          sudo journalctl -k --no-pager 2>/dev/null | grep -iE 'oom|killed process|segfault|traps|out of memory' | tail -40 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: |
            web/probe/
            web/test-results/
          retention-days: 7
