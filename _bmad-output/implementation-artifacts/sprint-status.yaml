#     Epic 14（K8s）另外 18.5 h，不在可砍的範圍，期限 2027-03 底，不算進寒假預算。
#   - PRD §8.1 的 Must 中位估計：187 h（樂觀 148 h、悲觀 229 h），比逐 Story 合計少很多。
#   - 寒假（12/25～2/14）的功能預算：120～150 h（PRD §8.4，寒假可用總時數 180～225 h）。
#   - 12 月切片是 Epic 1＋2，估計合計 66 h（Epic 1 29 h、Epic 2 37 h）；
#     PRD §8.4 留給 12 月 Must 的時間只有 30～40 h，可能做不完 Epic 2。
#   - K6、K8、K9 全部用上（拿掉 Epic 12 的 19 h、Epic 7 的 12 h），再扣掉 Epic 1＋2，
