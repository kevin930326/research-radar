# 本機開發用：`docker compose up -d --build` 起四個服務。
# 正式／試用主機的 compose（只有 api、worker、cloudflared）在 Story 3.19 放 deploy/。
# 規則：只用 api、worker 各一個 `.env.radar`（required: false、format: raw：值原樣讀入、
# 不做 $ 替換）的 env_file，compose 檔本身也不做變數替換；
# 秘密不放這裡（本機資料庫用 trust 驗證、只綁 127.0.0.1）。`.env.radar` 只放 RADAR_* 秘密
# （見 .env.radar.example，ADR-0024），不進 git；乾淨的 clone、CI 沒有這個檔時照樣起得來。
# environment 寫的值（DATABASE_URL 等）優先於 env_file。整個 .env 不載入容器。
# api、worker 只拿應用程式角色（radar_app）的連線字串；擁有者（radar_owner）的只在執行
# `radar migrate` 時用 `docker compose run -e RADAR_MIGRATION_DATABASE_URL=... api radar migrate` 傳入。
name: research-radar

x-logging: &logging
  # 每個容器的日誌大小與份數上限（NFR-15、ADR-0003 決定第 10 點）。
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    # 超級使用者是映像預設的 postgres；api、worker 用 radar_app，遷移用 radar_owner（ADR-0018）。
    environment:
      POSTGRES_DB: radar
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # 資料卷第一次初始化時建兩個角色與擴充套件；之後不會重跑（要重建就 down -v）。
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 走 TCP：初始化期間的暫時伺服器只開 Unix socket，這樣初始化腳本跑完才算健康。
      test: ["CMD", "pg_isready", "--host", "127.0.0.1", "--username", "postgres", "--dbname", "radar"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *logging

  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      # 空字串：RustFS 的日誌改寫到 stdout，才受上面的日誌上限管理。
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    logging: *logging

  api:
    build: .
    command: ["python", "-m", "radar.entrypoints.api"]
    env_file:
      - path: .env.radar
        required: false
        format: raw
    environment:
      DATABASE_URL: postgresql://radar_app@db:5432/radar
      RADAR_API_SHUTDOWN_GRACEFUL_TIMEOUT: "10"
      # 本機開發：開假登入（選一位允許名單上的成員登入，ADR-0046）；正式／試用主機的 compose 不這樣設。
      RADAR_ENVIRONMENT: development
      RADAR_FAKE_LOGIN: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # api 350m＋worker 400m＝750 MiB（Docker 的 m 是 MiB）。AGENTS.md 的 750 MB 以 MiB 計
    # （Kevin 2026-11-14 決定）；PDF 子行程的記憶體到 Epic 6 實測再定（ADR-0003）。
    mem_limit: 350m
    # 比 RADAR_API_SHUTDOWN_GRACEFUL_TIMEOUT 長，Docker 才不會在請求做完前強制關掉。
    stop_grace_period: 20s
    logging: *logging

  worker:
    build: .
    command: ["python", "-m", "radar.entrypoints.worker"]
    env_file:
      - path: .env.radar
        required: false
        format: raw
    environment:
      DATABASE_URL: postgresql://radar_app@db:5432/radar
      RADAR_WORKER_SHUTDOWN_GRACEFUL_TIMEOUT: "30"
    depends_on:
      db:
        condition: service_healthy
    # 750 MiB 的另一半，見 api 的 mem_limit 註解。
    mem_limit: 400m
    # 比 RADAR_WORKER_SHUTDOWN_GRACEFUL_TIMEOUT 長（ADR-0004）。
    stop_grace_period: 45s
    logging: *logging

volumes:
  db-data:
  rustfs-data:
